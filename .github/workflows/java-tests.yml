name: Quiz 3 - 5143706

on:
  push:  # run on every push
  pull_request:   # and on every pull request
  workflow_dispatch:  # adds a "Run workflow" button

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Get the Code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"      

      - name: Compile src and test
        run: |
          mkdir -p bin
          javac -cp "lib/*" -d bin src/*.java test/*.java

      - name: Run Junit tests
        run: |
          java -jar lib/junit-platform-console-standalone-6.1.3.jar execute --class-path bin --select-class CalculatorTest --details=summary

      - name: Show student name
        run: echo "Student Name: ${{ github.actor }}"

