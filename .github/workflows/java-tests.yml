name: Quiz 3 - 5143706

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile src and test
        run: |
          mkdir -p bin
          $sources = Get-ChildItem -Path src, test -Filter *.java -Recurse | ForEach-Object { $_.FullName }
          javac -d bin -cp "lib/*" $sources

      - name: Run JUnit tests
        run: |
          java -jar lib/junit-platform-console-standalone-6.1.3.jar execute `
            --class-path bin --scan-class-path --disable-banner